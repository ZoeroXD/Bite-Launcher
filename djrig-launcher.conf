
# --- BiteDJ Launcher ---
#BITEDJ_APP=/home/xdj/bitedj/build/mixxx   # what Launch runs (default: ~/bitedj/build/mixxx)
#BITEDJ_APP_ARGS=--fullScreen             # arguments for it
BITEDJ_LAUNCHER_AUTOLAUNCH=0      # 1 = start BiteDJ on its own once a controller is recognized
BITEDJ_FIN_SECONDS=30             # seconds for the shark fin to cross the screen (slow, Jaws-like)
BITEDJ_CLOCK_FORMAT=%-I:%M %p     # 24-hour clock: %H:%M
#BITEDJ_CONTROLLER_DIRS=/opt/bitedj/share/mixxx/controllers   # override mapping folders (colon-separated)
